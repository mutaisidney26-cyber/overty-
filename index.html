<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Broke Trap - Cinematic Stickman Film</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050507;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #stage-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 177.78vh;
      max-height: 56.25vw;
      background: #0e0e12;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #controls {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(16, 16, 22, 0.88);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 6px 12px;
      border-radius: 999px;
      z-index: 20;
      backdrop-filter: blur(8px);
      transition: opacity 0.25s;
    }
    #controls.hidden { opacity: 0; pointer-events: none; }
    button {
      background: #ffffff;
      color: #0e0e12;
      border: none;
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    button.secondary {
      background: rgba(255,255,255,0.12);
      color: #ffffff;
    }
    #timer {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: #bbb;
      min-width: 68px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="stage-wrap">
    <canvas id="stage" width="1280" height="720"></canvas>
  </div>

  <div id="controls">
    <button id="playBtn">Pause</button>
    <button id="restartBtn" class="secondary">Restart</button>
    <button id="cleanBtn" class="secondary">Clean Record</button>
    <span id="timer">0:00 / 1:40</span>
  </div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const W = 1280, H = 720;

const SCENES = [
  { start: 0,  end: 10, caption: "It’s Friday night. Payday finally hits—and for one brief moment, you can breathe." },
  { start: 10, end: 22, caption: "Before Monday morning, rent, power, groceries, and fees wipe the entire account out." },
  { start: 22, end: 38, caption: "Harvard & Princeton found financial stress drops functional IQ by 13 full points." },
  { start: 38, end: 56, caption: "Your brain enters Tunnel Vision—locking onto survival and blinding you to long-term exits." },
  { start: 56, end: 78, caption: "The Poverty Tax: cheap $30 boots replaced 10 times cost $300. One $120 pair lasts 5 years." },
  { start: 78, end: 100,caption: "To escape the pit, automate small survival choices first—and reclaim your mental bandwidth." }
];
const TOTAL_DURATION = 100;

let elapsed = 0;
let playing = true;
let lastTs = null;

const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * clamp(t);
const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);
const easeInOutSine = t => -(Math.cos(Math.PI * clamp(t)) - 1) / 2;

// Atmospheric dust particles (signature tavieenfilm depth)
const particles = Array.from({ length: 38 }, (_, i) => ({
  x: (i * 197) % W,
  y: (i * 131) % H,
  r: 1 + (i % 3) * 0.8,
  speedY: -8 - (i % 5) * 3,
  alpha: 0.08 + (i % 4) * 0.05
}));

function drawDust(t) {
  ctx.save();
  for (const p of particles) {
    const py = ((p.y + t * p.speedY) % H + H) % H;
    const px = p.x + Math.sin(t * 0.8 + p.y) * 14;
    ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
    ctx.beginPath();
    ctx.arc(px, py, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// Drawn dark-mode apartment room environment
function drawRoomEnvironment(t, options = {}) {
  const { windowGlow = 'rgba(130, 170, 255, 0.14)', redAlert = 0, dayLabel = 'FRI' } = options;

  // Wall gradient
  const wall = ctx.createLinearGradient(0, 0, 0, 560);
  wall.addColorStop(0, '#16161d');
  wall.addColorStop(1, '#101015');
  ctx.fillStyle = wall;
  ctx.fillRect(0, 0, W, 560);

  // Dark hardwood floor with perspective planks
  ctx.fillStyle = '#0a0a0e';
  ctx.fillRect(0, 560, W, 160);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 560); ctx.lineTo(W, 560);
  ctx.stroke();

  // Apartment Window (Left-back)
  ctx.save();
  ctx.fillStyle = '#090b10';
  ctx.strokeStyle = '#262632';
  ctx.lineWidth = 6;
  ctx.fillRect(130, 120, 210, 250);
  ctx.strokeRect(130, 120, 210, 250);

  // Moonlight / city glow through window
  const wGrad = ctx.createRadialGradient(235, 220, 10, 235, 245, 260);
  wGrad.addColorStop(0, windowGlow);
  wGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = wGrad;
  ctx.fillRect(90, 90, 420, 450);

  // Window panes
  ctx.strokeStyle = '#22222c';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(235, 120); ctx.lineTo(235, 370);
  ctx.moveTo(130, 245); ctx.lineTo(340, 245);
  ctx.stroke();
  ctx.restore();

  // Wall Calendar (Right-back)
  ctx.save();
  ctx.fillStyle = '#1b1b24';
  ctx.strokeStyle = redAlert > 0.5 ? '#ff4d4d' : '#323240';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(960, 145, 115, 125, 10);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = redAlert > 0.5 ? '#ff4d4d' : '#3b82f6';
  ctx.fillRect(960, 145, 115, 30);
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('PAY CYCLE', 1017, 165);
  ctx.font = '900 34px sans-serif';
  ctx.fillText(dayLabel, 1017, 226);
  ctx.restore();

  // Desk on the right side
  ctx.save();
  ctx.fillStyle = '#181820';
  ctx.strokeStyle = '#2c2c38';
  ctx.lineWidth = 3;
  ctx.fillRect(740, 430, 320, 18);
  ctx.strokeRect(740, 430, 320, 18);
  // Desk legs
  ctx.fillRect(765, 448, 14, 112);
  ctx.fillRect(1020, 448, 14, 112);

  // Desk lamp casting soft cone of light
  ctx.strokeStyle = '#4a4a5a';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(1005, 430); ctx.lineTo(1015, 355); ctx.lineTo(975, 335);
  ctx.stroke();
  const lampLight = ctx.createRadialGradient(965, 345, 5, 930, 410, 180);
  lampLight.addColorStop(0, 'rgba(255, 240, 200, 0.16)');
  lampLight.addColorStop(1, 'rgba(255, 240, 200, 0)');
  ctx.fillStyle = lampLight;
  ctx.beginPath();
  ctx.moveTo(975, 335); ctx.lineTo(810, 430); ctx.lineTo(1050, 430);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Red stress vignette pulse
  if (redAlert > 0) {
    const pulse = (0.5 + 0.5 * Math.sin(t * 5)) * redAlert * 0.25;
    const rVig = ctx.createRadialGradient(W/2, H/2, 260, W/2, H/2, 740);
    rVig.addColorStop(0, 'rgba(255,0,0,0)');
    rVig.addColorStop(1, `rgba(255, 40, 40, ${pulse})`);
    ctx.fillStyle = rVig;
    ctx.fillRect(0, 0, W, H);
  }
}

// Expressive, full-body animated stickman with breathing, blinking, walking, and hand gestures
function drawCharacter(x, y, scale = 1, t = 0, opts = {}) {
  const {
    mood = 'neutral',     // neutral | happy | stressed | worried | tired | triumphant
    pose = 'idle',        // idle | walk | handsOnHead | reachUp | pointRight
    facing = 1,           // 1 = right, -1 = left
    glowColor = 'rgba(255,255,255,0.6)',
    bodyColor = '#ffffff'
  } = opts;

  const breath = Math.sin(t * 2.6) * 3;
  const blink = (t % 3.8) > 3.65;
  const walkCycle = pose === 'walk' ? Math.sin(t * 7) : 0;
  const slump = (mood === 'stressed' || mood === 'tired') ? 10 : 0;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * facing, scale);

  // Ground contact shadow
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(0, 128, 34, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 20;
  ctx.strokeStyle = bodyColor;
  ctx.fillStyle = bodyColor;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Torso (curves slightly when stressed)
  ctx.lineWidth = 17;
  ctx.beginPath();
  ctx.moveTo(0, -42 + breath + slump);
  ctx.quadraticCurveTo(slump * 0.8, 8, 0, 50);
  ctx.stroke();

  // Legs (animated walk stride or grounded stance)
  ctx.lineWidth = 15;
  ctx.beginPath();
  ctx.moveTo(0, 50);
  ctx.lineTo(-22 + walkCycle * 26, 125 - Math.max(0, walkCycle) * 8);
  ctx.moveTo(0, 50);
  ctx.lineTo(22 - walkCycle * 26, 125 - Math.max(0, -walkCycle) * 8);
  ctx.stroke();

  // Arms based on pose
  ctx.lineWidth = 14;
  const shoulderY = -30 + breath + slump;
  ctx.beginPath();
  if (pose === 'handsOnHead') {
    const headY = -84 + breath + slump;
    ctx.moveTo(0, shoulderY);
    ctx.quadraticCurveTo(-48, shoulderY - 25, -28, headY - 8);
    ctx.moveTo(0, shoulderY);
    ctx.quadraticCurveTo(48, shoulderY - 25, 28, headY - 8);
  } else if (pose === 'reachUp') {
    const wave = Math.sin(t * 4) * 6;
    ctx.moveTo(0, shoulderY);
    ctx.quadraticCurveTo(-36, shoulderY - 45, -32, shoulderY - 92 + wave);
    ctx.moveTo(0, shoulderY);
    ctx.quadraticCurveTo(36, shoulderY - 45, 32, shoulderY - 92 - wave);
  } else if (pose === 'pointRight') {
    ctx.moveTo(0, shoulderY);
    ctx.lineTo(-26, shoulderY + 52);
    ctx.moveTo(0, shoulderY);
    ctx.lineTo(62, shoulderY - 8);
  } else {
    // Natural idle or walk arm swing
    ctx.moveTo(0, shoulderY);
    ctx.quadraticCurveTo(-30, shoulderY + 26, -34 - walkCycle * 18, shoulderY + 58);
    ctx.moveTo(0, shoulderY);
    ctx.quadraticCurveTo(30, shoulderY + 26, 34 + walkCycle * 18, shoulderY + 58);
  }
  ctx.stroke();

  // Head
  const headX = slump * 0.7;
  const headY = -84 + breath + slump;
  ctx.beginPath();
  ctx.arc(headX, headY, 34, 0, Math.PI * 2);
  ctx.fill();

  // Face details (facing slightly toward direction of travel/gaze)
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#111116';
  ctx.strokeStyle = '#111116';
  ctx.lineWidth = 3.2;

  const eyeOffsetX = 6;
  if (blink) {
    ctx.beginPath();
    ctx.moveTo(headX + eyeOffsetX - 15, headY - 3); ctx.lineTo(headX + eyeOffsetX - 7, headY - 3);
    ctx.moveTo(headX + eyeOffsetX + 7, headY - 3);  ctx.lineTo(headX + eyeOffsetX + 15, headY - 3);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(headX + eyeOffsetX - 11, headY - 4, 4, 0, Math.PI * 2);
    ctx.arc(headX + eyeOffsetX + 11, headY - 4, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  if (mood === 'happy' || mood === 'triumphant') {
    ctx.beginPath();
    ctx.arc(headX + eyeOffsetX, headY + 6, 11, 0.12 * Math.PI, 0.88 * Math.PI);
    ctx.stroke();
  } else if (mood === 'stressed' || mood === 'worried') {
    ctx.beginPath();
    ctx.moveTo(headX + eyeOffsetX - 18, headY - 11); ctx.lineTo(headX + eyeOffsetX - 6, headY - 16);
    ctx.moveTo(headX + eyeOffsetX + 18, headY - 11); ctx.lineTo(headX + eyeOffsetX + 6, headY - 16);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(headX + eyeOffsetX, headY + 17, 10, 1.15 * Math.PI, 1.85 * Math.PI);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(headX + eyeOffsetX - 8, headY + 11);
    ctx.lineTo(headX + eyeOffsetX + 8, headY + 11);
    ctx.stroke();
  }

  ctx.restore();
}

// Illustrated falling paper bill / envelope (instead of generic UI cards)
function drawFlyingEnvelope(x, y, angle, title, amount, progress) {
  if (progress <= 0) return;
  const p = easeOutCubic(progress);
  const curY = lerp(y - 260, y, p);
  const curRot = lerp(angle - 0.45, angle, p);

  ctx.save();
  ctx.translate(x, curY);
  ctx.rotate(curRot);
  ctx.globalAlpha = clamp(progress * 2);

  ctx.shadowColor = 'rgba(255, 60, 60, 0.45)';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#1d1418';
  ctx.strokeStyle = '#ff4d4d';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.roundRect(-86, -34, 172, 68, 6);
  ctx.fill();
  ctx.stroke();

  // Envelope flap lines
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255, 77, 77, 0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-84, -32); ctx.lineTo(0, 2); ctx.lineTo(84, -32);
  ctx.stroke();

  ctx.fillStyle = '#ff8080';
  ctx.font = '800 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(title, 0, -10);

  ctx.fillStyle = '#ffffff';
  ctx.font = '900 22px sans-serif';
  ctx.fillText(amount, 0, 20);
  ctx.restore();
}

function drawTitle(text, x, y, size = 48, color = '#ffffff', glow = 'rgba(255,255,255,0.35)') {
  ctx.save();
  ctx.font = `900 ${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = glow;
  ctx.shadowBlur = 22;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawSubtitle(text) {
  ctx.save();
  ctx.fillStyle = 'rgba(6, 6, 10, 0.78)';
  ctx.beginPath();
  ctx.roundRect(160, H - 68, W - 320, 44, 10);
  ctx.fill();

  ctx.fillStyle = '#f1f5f9';
  ctx.font = '600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, H - 46);
  ctx.restore();
}

function render(t) {
  ctx.fillStyle = '#0e0e12';
  ctx.fillRect(0, 0, W, H);

  // SCENE 1: PAYDAY FRIDAY IN APARTMENT (0 - 10s)
  if (t < 10) {
    const camZoom = 1 + easeInOutSine(t / 10) * 0.06;
    ctx.save();
    ctx.translate(W/2, H/2); ctx.scale(camZoom, camZoom); ctx.translate(-W/2, -H/2);

    drawRoomEnvironment(t, { windowGlow: 'rgba(74, 222, 128, 0.16)', dayLabel: 'FRI' });
    drawDust(t);

    // Glowing phone balance notification above desk
    const pop = easeOutCubic(t / 1.2);
    ctx.save();
    ctx.translate(880, 315 - pop * 18);
    ctx.fillStyle = '#13221a';
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(-95, -34, 190, 68, 12); ctx.fill(); ctx.stroke();
    drawTitle('+$1,400.00', 0, 2, 26, '#4ade80', 'rgba(74,222,128,0.5)');
    ctx.restore();

    drawTitle('PAYDAY FRIDAY', W / 2, 74, 52, '#ffffff');
    drawCharacter(530, 432, 1.0, t, { mood: 'happy', pose: 'reachUp', facing: 1 });
    ctx.restore();
  }

  // SCENE 2: BILLS RAIN DOWN BEFORE MONDAY (10 - 22s)
  else if (t < 22) {
    const lt = t - 10;
    const isMon = lt > 7.5;
    drawRoomEnvironment(t, {
      windowGlow: 'rgba(255, 77, 77, 0.14)',
      redAlert: clamp(lt / 4),
      dayLabel: isMon ? 'MON' : 'SUN'
    });
    drawDust(t);

    drawTitle(
      isMon ? 'MONDAY MORNING: $0.00' : '48 HOURS LATER...',
      W / 2, 74, 48,
      isMon ? '#ff4d4d' : '#ffffff',
      isMon ? 'rgba(255,77,77,0.55)' : 'rgba(255,255,255,0.35)'
    );

    // Character reacts with hands on head as envelopes slam onto the desk & floor
    drawCharacter(520, 432, 1.0, t, {
      mood: 'stressed',
      pose: lt > 2 ? 'handsOnHead' : 'idle',
      facing: 1
    });

    drawFlyingEnvelope(790, 395, -0.08, 'RENT NOTICE', '-$850', (lt - 0.5) / 0.9);
    drawFlyingEnvelope(940, 392,  0.06, 'POWER BILL',  '-$210', (lt - 2.2) / 0.9);
    drawFlyingEnvelope(830, 355,  0.12, 'GROCERIES',   '-$190', (lt - 4.0) / 0.9);
    drawFlyingEnvelope(920, 345, -0.14, 'BANK FEE',    '-$150', (lt - 5.8) / 0.9);
  }

  // SCENE 3: -13 IQ POINTS COGNITIVE BANDWIDTH TEST (22 - 38s)
  else if (t < 38) {
    const lt = t - 22;
    const bg = ctx.createRadialGradient(W/2, H/2, 60, W/2, H/2, 740);
    bg.addColorStop(0, '#191922'); bg.addColorStop(1, '#0a0a0e');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    drawDust(t);

    // Floor line
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.moveTo(0, 565); ctx.lineTo(W, 565); ctx.stroke();

    drawTitle('HARVARD & PRINCETON STUDY', W / 2, 66, 42, '#ffffff');
    drawTitle('FINANCIAL STRESS = -13 IQ POINTS', W / 2, 118, 26, '#ff4d4d', 'rgba(255,77,77,0.5)');

    // Left: Overloaded brain
    drawCharacter(350, 436, 0.98, t, { mood: 'stressed', pose: 'handsOnHead', facing: 1 });
    drawTitle('SCARCITY BRAIN', 350, 205, 24, '#ff6b6b');
    for (let i = 0; i < 3; i++) {
      const r = 42 + ((lt * 32 + i * 16) % 42);
      ctx.strokeStyle = `rgba(255, 70, 70, ${1 - (r - 42) / 42})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(356, 358, r, 0, Math.PI * 2); ctx.stroke();
    }

    // Center divider
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.moveTo(W/2, 170); ctx.lineTo(W/2, 565); ctx.stroke();

    // Right: Clear bandwidth
    drawCharacter(930, 436, 0.98, t, { mood: 'happy', pose: 'pointRight', facing: -1 });
    drawTitle('ABUNDANT BRAIN', 930, 205, 24, '#4ade80');
    drawTitle('FULL MENTAL BANDWIDTH', 930, 245, 19, '#a7f3d0');
  }

  // SCENE 4: 3D PERSPECTIVE TUNNEL VISION (38 - 56s)
  else if (t < 56) {
    const lt = t - 38;
    const narrow = clamp(lt / 7);

    // 3D perspective corridor lines
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    const vanishX = 960, vanishY = 360;
    for (const [cx, cy] of [[0,0],[W,0],[0,H],[W,H],[0,360],[W,360]]) {
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(vanishX, vanishY); ctx.stroke();
    }
    // Depth rings moving toward viewer
    for (let i = 0; i < 5; i++) {
      const p = ((lt * 0.35 + i * 0.2) % 1);
      const rw = lerp(180, 1280, p);
      const rh = lerp(100, 720, p);
      ctx.strokeStyle = `rgba(255,255,255,${0.04 + p * 0.12})`;
      ctx.strokeRect(vanishX - rw/2, vanishY - rh/2, rw, rh);
    }

    // Glowing exit door on the far right
    ctx.strokeStyle = '#4ade80';
    ctx.shadowColor = 'rgba(74,222,128,0.6)';
    ctx.shadowBlur = 22;
    ctx.lineWidth = 4;
    ctx.strokeRect(1030, 260, 115, 210);
    ctx.shadowBlur = 0;
    drawTitle('EXIT', 1087, 232, 22, '#4ade80');

    // Closing tunnel blinders
    const wallH = narrow * 175;
    ctx.fillStyle = '#050507';
    ctx.fillRect(0, 0, W, wallH);
    ctx.fillRect(0, H - wallH, W, wallH);

    drawTitle('TUNNEL VISION', W / 2, 74 + wallH * 0.35, 48, '#ffffff');
    drawCharacter(390, 420, 0.95, t, { mood: 'worried', pose: 'walk', facing: 1 });
    drawFlyingEnvelope(740, 390, 0, 'PAY TODAY', 'URGENT', 1);
  }

  // SCENE 5: THE POVERTY TAX (BOOTS COMPARISON) (56 - 78s)
  else if (t < 78) {
    const lt = t - 56;
    const bg = ctx.createRadialGradient(W/2, H/2, 60, W/2, H/2, 740);
    bg.addColorStop(0, '#191922'); bg.addColorStop(1, '#0a0a0e');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    drawDust(t);

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.moveTo(0, 565); ctx.lineTo(W, 565); ctx.stroke();

    drawTitle('THE POVERTY TAX (5 YEARS)', W / 2, 68, 44, '#ffffff');

    const pairs = Math.min(10, Math.floor(lt * 0.65) + 1);
    drawTitle('$30 BOOTS x 10 PAIRS', 350, 165, 26, '#ff6b6b');
    drawTitle(`TOTAL SPENT: $${pairs * 30}`, 350, 212, 32, '#ffffff');
    drawCharacter(350, 436, 0.95, t, { mood: 'stressed', pose: 'handsOnHead', facing: 1 });

    drawTitle('$120 QUALITY BOOTS x 1', 930, 165, 26, '#4ade80');
    drawTitle('TOTAL SPENT: $120', 930, 212, 32, '#ffffff');
    drawCharacter(930, 436, 0.95, t, { mood: 'happy', pose: 'idle', facing: -1 });

    if (lt > 11) {
      drawTitle('BEING BROKE COSTS $180 MORE', W / 2, 605, 28, '#facc15', 'rgba(250,204,21,0.45)');
    }
  }

  // SCENE 6: CLIMBING OUT OF THE PIT (78 - 100s)
  else {
    const lt = t - 78;
    const climb = easeOutCubic(lt / 12);

    const bg = ctx.createRadialGradient(W/2, 120, 40, W/2, H/2, 760);
    bg.addColorStop(0, '#232018'); bg.addColorStop(1, '#09090c');
